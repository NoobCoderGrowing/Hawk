server:
  # web 模块占 8080、segment 演示应用占 3333，
  # cloud-indexer 占 8091、cloud-recall 占 8092，这里 8090 避免冲突。
  port: ${HAWK_CLOUD_COORDINATOR_PORT:8090}

hawk:
  cloud:
    coordinator:
      # 总分片数。两个用途：
      #   · POST /index/build 的 shardCount 缺省值（请求体里给了就用请求体的）
      #   · round tracker 决定要检查 shard-0 … shard-（N-1）
      shard-count: ${HAWK_SHARD_COUNT:3}

      # ---- 发起索引构建（POST /index/build，见 IndexBuildController / IndexBuildDispatcher）----
      build:
        # 协调器 → 索引器单次派发的等待上限。索引器只做「校验 + startAsync」，**立刻**回 202，
        # 所以 5 秒已经很宽（建连超时在代码里固定 2 秒）。
        #
        # ⚠️ 别和 hawk.cloud.indexer.push.timeout-ms 混了 —— 那个是真的在传 200 MB，给的是 10 分钟。
        #    这里和「协调器 → /repush」是一类：都只等一个受理回执。
        timeout-ms: ${HAWK_BUILD_TIMEOUT_MS:5000}
      # 注册中心地址，写法与 cloud-indexer / cloud-recall 一致：
      #   · 单节点     127.0.0.1:6001
      #   · 集群节点表 {1:'127.0.0.2:6001',2:'127.0.0.2:6002',3:'127.0.0.3:6003'}
      # 协调器从这里 listAll 出四类节点（见 roleType.md），每类一个字典：
      #   cloud/text-indexer    倒排索引器
      #   cloud/vector-indexer  向量索引器
      #   cloud/text-recall     倒排搜索分片
      #   cloud/vector-recall   向量索引分片
      registry-address: ${HAWK_REGISTRY_ADDRESS:{1:'127.0.0.2:6001',2:'127.0.0.2:6002',3:'127.0.0.3:6003'}}

      # 协调器自己也向注册中心登记，好让 indexer / recall 能按地址找到它并发通知。
      # **它不是分片节点** —— 不配 shard-num / shard-id，登记出来的 key 只有一段：
      #   /cloud/coordinator -> {ip}:{port}
      role: ${HAWK_ROLE:coordinator}
      ip: ${HAWK_NODE_IP:127.0.0.1}
      # port 默认跟随 server.port（上面那个），换端口启动时不必两处都改
      port: ${HAWK_NODE_PORT:${server.port}}
      # 心跳重登记间隔（毫秒）
      register-interval-ms: ${HAWK_REGISTER_INTERVAL_MS:60000}

      # 轮询间隔（毫秒），默认 60 秒。管的是「成员与地址」——从注册中心拉谁在册。
      poll-interval-ms: ${HAWK_COORDINATOR_POLL_MS:60000}

      # ---- round tracker（见 RoundTracker）----
      # 「每一轮索引有没有真的建成」靠它收敛：定时查召回副本报的 round，没有就重下发。
      #
      # ⚠️ 这个间隔**必须远大于一次构建的耗时**，它不是"检查频率"那么随意：
      #    构建是分钟级（向量 10 万篇 ≈ 16 分钟），间隔小于构建耗时就会在构建**刚开始**时
      #    判"这一轮没人建" → 重下发 → 两个副本同时建同一片。默认 30 分钟。
      round-check-interval-ms: ${HAWK_ROUND_CHECK_INTERVAL_MS:1800000}

      # 重下发次数上限。到顶就写"放弃标记"放行下一轮，并打 ERROR。
      # 没有上限的话，一个永久坏的分片会被每 30 分钟重建一轮，**永远建下去**。
      round-max-attempts: ${HAWK_ROUND_MAX_ATTEMPTS:3}


logging:
  level:
    root: INFO
    # NettyClient 把每一条收到的报文都按 INFO 打出来，轮询一轮就是两条全量 ls 结果。
    # 降成 WARN：同 web 模块对 DJL / jvector 的做法。
    io.github.noobcodergrowing.jregistryclient: WARN
