server:
  # web=8080、segment 演示应用=3333、cloud-coordinator=8090、cloud-indexer=8091，
  # 这里另起一个避免冲突。
  port: ${HAWK_CLOUD_RECALL_PORT:8092}

hawk:
  cloud:
    recall:
      # 倒排索引目录（含 segment.info / 1.fdt / 1.frq …）。
      # 相对路径以**启动时的工作目录**为基准。
      index-dir: ${HAWK_INDEX_DIR:index-data/goods}

      # 注册中心地址，本节点启动时向它登记。
      registry-address: ${HAWK_REGISTRY_ADDRESS:}

logging:
  level:
    root: INFO
