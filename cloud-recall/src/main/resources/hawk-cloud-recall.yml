server:
  # web=8080、segment 演示应用=3333、cloud-coordinator=8090、cloud-indexer=8091，
  # 这里另起一个避免冲突。
  port: ${HAWK_CLOUD_RECALL_PORT:8092}

hawk:
  cloud:
    recall:
      # 倒排索引目录（含 segment.info / 1.fdt / 1.frq …）。
      # 相对路径以**启动时的工作目录**为基准。 完整路径为{index-dir}/{role}/{shard-num}/{yyyy-MM-dd-HH-mm-ss}（时间戳由索引器传来，见 IndexStamp）
      index-dir: ${HAWK_INDEX_DIR:cloud/recall}

      # ---- 拉取索引（见 IndexPullJob / INDEX_PULL_MODEL_DESIGN.md）----
      # 本节点定时扫注册中心，看哪个索引器有**比自己更新**的轮次，有就拉下来装好。
      # 拉取失败只记一条日志、**不设重试上限** —— 定时扫描本身就是无限的幂等重试。
      # 这和协调器那边"重下发必须设上限"是相反的，因为代价不同：这边重试的是一次传输
      # （廉价、幂等），那边重试的是重算一遍索引（向量 10 万篇 16 分钟）。
      #
      # 这个间隔还要和"索引器保留几份"配着看：索引器只留最新 2 份，
      # 所以必须保证 2 × 构建间隔 > 本间隔，否则某一轮还没被拉走就被删了。
      pull-interval-ms: ${HAWK_RECALL_PULL_INTERVAL_MS:60000}

      pull:
        # 一次下载的等待上限（毫秒）。这是**真的在传数据**（200 MB 级），
        # 别和"等一个受理回执"那类秒级超时混。
        timeout-ms: ${HAWK_RECALL_PULL_TIMEOUT_MS:600000}
        # 拉下来的临时包放哪；留空则放在本分片的索引目录下 ——
        # 文件名带 `.staging-` 前缀，于是会被 IndexStore.cleanStaleStaging 统一收走。
        tmp-dir: ${HAWK_RECALL_PULL_TMP_DIR:}

      # 注册中心（JRegistry）地址。留空则跳过登记，只记一条 WARN。两种写法都认：
      #   · 单节点     127.0.0.1:6001
      #   · 集群节点表 {1:'127.0.0.2:6001',2:'127.0.0.2:6002',3:'127.0.0.3:6003'}
      # 节点表按 key 数值升序逐个试连，第一个连上的就用。
      # 注意**不要在外面再套一层引号** —— 那会让它退化成单节点写法而解析失败。
      registry-address: ${HAWK_REGISTRY_ADDRESS:{1:'127.0.0.2:6001',2:'127.0.0.2:6002',3:'127.0.0.3:6003'}}

      # 登记内容：key = /cloud/{role}/{shard-num}/{shard-id}，value = {ip}:{port}
      #   role      节点角色，用于区分索引节点与检索节点
      #   shard-num 第几个分片，是一段名字（如 shard-1），不是数字
      #   shard-id  该分片的副本编号（如 id-0）—— 一个分片有多个副本，靠它区分
      #   ip / port 本节点对外地址，作为 value 写入；port 默认跟随 server.port，
      #             换端口启动时不必两处都改
      role: ${HAWK_ROLE:text-recall}
      shard-num: ${HAWK_SHARD_NUM:shard-1}
      shard-id: ${HAWK_SHARD_ID:id-0}
      ip: ${HAWK_NODE_IP:127.0.0.1}
      port: ${HAWK_NODE_PORT:${server.port}}

      # 心跳式重登记间隔（毫秒）。节点只在启动时登记一次，而这条 key 可能被协调器的健康检查
      # 误删（失败计数跨了节点重启那种情形），定期重发能把存活窗口压到一个心跳周期内。
      register-interval-ms: ${HAWK_REGISTER_INTERVAL_MS:60000}

logging:
  level:
    root: INFO
